# These jobs are run on everything, including main and PRs.
#
# The project builds and tests against Xcode 27 / iOS 27.0, and the snapshot
# references are recorded on that runtime. No GitHub-hosted GA image provides
# Xcode 27 yet: `macos-26` tops out at Xcode 26.6 and carries no iOS 27.0
# simulator runtime. The beta `xcode-27` image does have both, but its runner
# pool could not absorb a 14-way test matrix — every shard sat queued
# indefinitely.
#
# So the jobs that need Xcode 27 (Lint, CI_iOS Build & Test) run on the
# badbundle self-hosted runner (`[self-hosted, macOS, studio]`): a Mac that runs
# each job in a fresh macOS VM with /Applications/Xcode_27.0.app and an iPhone 18
# Pro Max / iOS 27.0 simulator, one job at a time. Release Config only needs
# Ruby, so it stays on GitHub-hosted `macos-26`.
#
# Because jobs run one at a time, CI_iOS builds and runs every test suite in a
# single job. Per-suite shards only pay off when they fan out across many
# machines; on one, about 85% of each shard's time was repeated setup.
#
# This repo is public, so the self-hosted jobs skip pull requests from forks
# (the `if:` on each job), and a fork PR fails the CI_iOS check until its changes
# are pushed to a branch in this repo. That guard is not a security boundary: a
# fork PR can edit this file. What protects the runner is that the repo requires
# approval before workflows run for any external contributor, so review a
# fork's changes before approving its workflows.
#
# Xcode is selected with DEVELOPER_DIR rather than `sudo xcode-select`, which
# works on any runner without needing sudo.
#
# MOVE BACK to GitHub-hosted runners once an image ships Xcode 27 and iOS 27.0:
# set `runs-on` back to that image and drop the fork `if:` guards (per-suite
# shards may be worth restoring there). Track availability at
# https://github.com/actions/runner-images
name: Validate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  XCODE_VERSION: "27.0"

jobs:
  release-config:
    name: Release Config
    timeout-minutes: 5
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6.0.3

      # The repo Actions allowlist permits GitHub-owned actions only, so this
      # uses the Ruby version already installed on the macOS runner.
      - name: Install Ruby dependencies
        run: |
          ruby -v
          bundle install

      - name: Validate Ruby and Fastlane config
        run: |
          ruby -v
          bundle exec ruby -c fastlane/Fastfile
          bundle exec fastlane --version
          bundle exec fastlane lanes

  lint:
    name: Lint
    timeout-minutes: 2
    runs-on: [self-hosted, macOS, studio]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: ./Vault

    steps:
      - uses: actions/checkout@v6.0.3
      - run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Cache SPM Dependencies
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            Vault/.build
          key: ${{ runner.os }}-spm-lint-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('Vault/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-lint-xcode-${{ env.XCODE_VERSION }}-

      - name: Check Linting & Formatting
        run: make lint

  ci-ios-build-and-test:
    name: CI_iOS Build & Test
    timeout-minutes: 30
    runs-on: [self-hosted, macOS, studio]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v6.0.3
      - run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Log Xcode Version
        run: xcodebuild -version

      - name: Cache SPM Dependencies
        uses: actions/cache@v5.0.5
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: ${{ runner.os }}-spm-ci-ios-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('Vault/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-ci-ios-xcode-${{ env.XCODE_VERSION }}-

      - name: Build CI_iOS
        run: |
          xcodebuild build-for-testing \
            -workspace Vault.xcworkspace \
            -scheme CI_iOS \
            -testPlan iOSAllTests \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro Max,OS=27.0' \
            -derivedDataPath "$RUNNER_TEMP/ci-ios-derived-data" \
            -skipMacroValidation \
            -skipPackagePluginValidation

      - name: Run CI_iOS Tests
        run: |
          XCTESTRUN="$(find "$RUNNER_TEMP/ci-ios-derived-data/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"

          if [[ -z "$XCTESTRUN" ]]; then
            echo "No .xctestrun file found in the CI_iOS build products."
            exit 1
          fi

          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro Max,OS=27.0' \
            -parallel-testing-enabled NO

  ci-ios:
    name: CI_iOS
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: ci-ios-build-and-test
    if: always()

    steps:
      - name: Check CI_iOS Result
        run: |
          if [[ "${{ needs.ci-ios-build-and-test.result }}" != "success" ]]; then
            echo "CI_iOS build & test result: ${{ needs.ci-ios-build-and-test.result }}"
            exit 1
          fi
